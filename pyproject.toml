[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panah-panel"
version = "1.0.0"
description = "Panah — OpenVPN control plane with node, tunnel and client management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "SQLAlchemy>=2.0.30,<3.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "PyJWT>=2.9,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "pyotp>=2.9,<3.0",
    "cryptography>=43,<47",
    "httpx>=0.27,<1.0",
    "APScheduler>=3.10,<4.0",
    "psutil>=6.0,<8.0",
    "Jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "qrcode>=7.4,<9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10.0", "pytest-cov>=5.0,<8.0", "ruff>=0.7,<1.0"]

[project.scripts]
panah = "panel.cli:main"

[project.urls]
Homepage = "https://github.com/farnoudhosseini/vpn-panel"

[tool.setuptools.packages.find]
include = ["panel*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "web", "panel/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # The renderers build long f-strings on purpose; wrapping them hurts more
    # than the length rule helps.
    "E501",
    # FastAPI dependencies are declared in signatures, where B008 complains
    # about the calls that create them.
    "B008",
    # An explicit try/except around a best-effort filesystem call documents the
    # intent better than a one-line suppress().
    "SIM105",
    # The status enums inherit from `str` so they serialise as plain strings in
    # JSON and store as text in SQLite; StrEnum would change both.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
